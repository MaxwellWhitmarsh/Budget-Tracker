<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <title>Add Expense</title>
</head>
<body>

    <nav>
        <a href="index.html"><button>Home</button></a>
        <a href="add.html"><button>Add Expense</button></a>
        <a href="view/hide"><button>View Expense</button></a>
    </nav>

    <h1>Add Expense</h1>

    <p>Record each expense to see where your money goes.</p>
    <p> Hint: Enter an amount, pick or type a category, choose a date, then click Save Expense.</p>

    <form action="/expenses/add">
    <p>
        <label for="amount">Amount </label>
        <input type="number" id="amount" name="amount" step="0.01">
    </p>
    <p>
        <label for="category">Category</label>
        <select id="category" name= "category">
            <option value="">Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>
    </p>

    <p>
        <label for="date">Date</label>
        <input type="date" id="date" name="date">
    </p>

    <p>
        <label for="description">Description</label>
        <input id="description" name="description">
    </p>

    <button type="submit">Save Expense</button>
 </form>   

</body>
</html>
